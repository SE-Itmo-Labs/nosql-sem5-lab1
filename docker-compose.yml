services:

  redis-db:
    image: redis:8.10.1-alpine
    container_name: redis_container

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:8.10.1-alpine
    container_name: redis_replica1_container

    ports:
      - "127.0.0.1:6380:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:8.10.1-alpine
    container_name: redis_replica2_container

    ports:
      - "127.0.0.1:6381:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8.0
    hostname: mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongodb-init:
    image: mongo:8.0
    # Bootstrap through the MongoDB container's loopback interface.
    network_mode: service:mongodb
    entrypoint: ["timeout", "60s", "/bin/sh", "-ec"]
    command:
      - |
        until mongosh 'mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=1000' --norc --quiet --eval '
          const hello = db.runCommand({ hello: 1 });
          if (hello.setName === "rs0" && hello.isWritablePrimary) quit(0);

          if (hello.isreplicaset && !hello.setName) {
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            } catch (error) {
              if (error.codeName !== "AlreadyInitialized") throw error;
            }
          }
          quit(1);
        '; do
          sleep 1
        done
        echo 'MongoDB rs0 is ready'

  spring-app:
    build: .
    container_name: spring_app_container
    ports:
      - "127.0.0.1:16767:8080"

    env_file:
    - credentials.env

    depends_on:
      redis-db:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully
    environment:
      - SPRING_DATA_REDIS_HOST=redis-db
      - SPRING_DATA_REDIS_PORT=6379

      - REDIS_REPLICA1_HOST=redis-replica-1
      - REDIS_REPLICA1_PORT=6379
      - REDIS_REPLICA2_HOST=redis-replica-2
      - REDIS_REPLICA2_PORT=6379
      - REDIS_MASTER_HOST=redis-db
      - REDIS_MASTER_PORT=6379

      # В production оставляйте false: демонстрационные записи не должны
      # создаваться при каждом развёртывании приложения.
      - APP_DATA_INITIALIZER_ENABLED=${APP_DATA_INITIALIZER_ENABLED:-false}

      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/somedb_mongo?replicaSet=rs0}
#    restart: on-failure

volumes:
  mongo_data:
