services:

  redis-db:
    image: redis:8.10.1-alpine
    container_name: redis_container

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:8.10.1-alpine
    container_name: redis_replica1_container

    ports:
      - "127.0.0.1:6380:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:8.10.1-alpine
    container_name: redis_replica2_container

    ports:
      - "127.0.0.1:6381:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgresql:
    image: postgres:18.6-alpine3.24
    container_name: postgres_container

    ports:
    - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    env_file:
    - credentials.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in credentials.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in credentials.env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in credentials.env}

    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  spring-app:
    build: .
    container_name: spring_app_container
    ports:
      - "127.0.0.1:16767:8080"

    env_file:
    - credentials.env

    depends_on:
      redis-db:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      - SPRING_DATA_REDIS_HOST=redis-db
      - SPRING_DATA_REDIS_PORT=6379

      - REDIS_REPLICA1_HOST=redis-replica-1
      - REDIS_REPLICA1_PORT=6379
      - REDIS_REPLICA2_HOST=redis-replica-2
      - REDIS_REPLICA2_PORT=6379
      - REDIS_MASTER_HOST=redis-db
      - REDIS_MASTER_PORT=6379

      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
    restart: on-failure

volumes:
  postgres_data:
