services:

  redis-db:
    image: redis:8.10.1-alpine
    container_name: redis_container

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:8.10.1-alpine
    container_name: redis_replica1_container

    ports:
      - "127.0.0.1:6380:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:8.10.1-alpine
    container_name: redis_replica2_container

    ports:
      - "127.0.0.1:6381:6379"

    command: redis-server --replicaof redis-db 6379 --protected-mode no

    depends_on:
      redis-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  spring-app:
    build: .
    container_name: spring_app_container
    ports:
      - "127.0.0.1:16767:8080"

    env_file:
    - credentials.env

    depends_on:
      redis-db:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      - SPRING_DATA_REDIS_HOST=redis-db
      - SPRING_DATA_REDIS_PORT=6379

      - REDIS_REPLICA1_HOST=redis-replica-1
      - REDIS_REPLICA1_PORT=6379
      - REDIS_REPLICA2_HOST=redis-replica-2
      - REDIS_REPLICA2_PORT=6379
      - REDIS_MASTER_HOST=redis-db
      - REDIS_MASTER_PORT=6379

      # В production оставляйте false: демонстрационные записи не должны
      # создаваться при каждом развёртывании приложения.
      - APP_DATA_INITIALIZER_ENABLED=${APP_DATA_INITIALIZER_ENABLED:-false}

      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/somedb_mongo?replicaSet=rs0}
#    restart: on-failure

volumes:
  mongo_data:
