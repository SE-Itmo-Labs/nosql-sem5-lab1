
# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.data.redis.repositories.enabled=false

# Redis topology used by the consistency laboratory.
app.redis-topology.nodes[0].id=primary
app.redis-topology.nodes[0].role=PRIMARY
app.redis-topology.nodes[0].host=${REDIS_MASTER_HOST:${REDIS_HOST:localhost}}
app.redis-topology.nodes[0].port=${REDIS_MASTER_PORT:${REDIS_PORT:6379}}
app.redis-topology.nodes[1].id=replica-1
app.redis-topology.nodes[1].role=REPLICA
app.redis-topology.nodes[1].host=${REDIS_REPLICA1_HOST:localhost}
app.redis-topology.nodes[1].port=${REDIS_REPLICA1_PORT:6380}
app.redis-topology.nodes[2].id=replica-2
app.redis-topology.nodes[2].role=REPLICA
app.redis-topology.nodes[2].host=${REDIS_REPLICA2_HOST:localhost}
app.redis-topology.nodes[2].port=${REDIS_REPLICA2_PORT:6381}
app.replication.wait-timeout-ms=${REDIS_WAIT_TIMEOUT_MS:500}
app.replication.wait-replicas=${REDIS_WAIT_REPLICAS:2}

# Postgres (.env)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:my_database}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.data-initializer.enabled=${APP_DATA_INITIALIZER_ENABLED:false}

server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://se-itmo-labs.github.io,https://se-itmo-labs.ssngn.ru,https://backend-se-itmo-labs.ssngn.ru}
